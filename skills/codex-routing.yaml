schema: "uash.codex-skill-routing.v1"
version: "2.0.0"
source_registry: "skills/registry.json"
selection:
  max_primary: 1
  max_supporting: 4
  ambiguity_fallback: "valdris-intake-route"
  finish_skill: "valdris-proof-handoff"
  implicit_invocation: true
  tie_break_order:
    - "explicit user outcome"
    - "highest consequential risk"
    - "artifact being changed"
    - "narrowest matching primaryFor"
    - "intake when scope remains ambiguous"
skills:
  - name: "valdris-intake-route"
    description: "Classify a new or ambiguous Valdris request and bind it to the smallest safe workflow. Select as the primary for generic end-to-end audits, mixed or unclear requests, greenfield discovery without a concrete build outcome, or work whose workload class, stakes, authority, production impact, and delivery workflow are not established. Intake owns the workload-classification artifact and route binding; it does not replace the matching delivery primary once the outcome is clear."
    path: "skills/valdris-intake-route/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "intake"
      - "ambiguous"
      - "audit"
      - "greenfield"
    triggers:
      - "new issue"
      - "new task"
      - "classify"
      - "route"
      - "what workflow"
    required_gates:
      - "goal"
      - "skill-registry"
      - "classification"
    conditional_gates:
      - "code-intelligence, foundation, and production for every non-docs audit or routed delivery request"
      - "controlled assurance docs require the lightweight Foundation review path"
    red_zone_triggers: []
  - name: "valdris-bug-rca"
    description: "Diagnose and repair bugs under the Valdris proof contract. Select as the delivery primary when the requested outcome is to explain or fix broken, intermittent, slow, regressed, or unexplained behavior through reproduction, root-cause evidence, a narrow fix, regression tests, and verified handoff. Use other domain skills only as support when the defect also affects security, platform, or AI boundaries."
    path: "skills/valdris-bug-rca/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "bug"
      - "regression"
      - "performance"
      - "incident-diagnosis"
    triggers:
      - "broken"
      - "failing"
      - "regression"
      - "root cause"
      - "why is"
    required_gates:
      - "classification"
      - "foundation"
      - "code-intelligence"
      - "production"
      - "proof"
    conditional_gates:
      - "smoke when runtime behavior is claimed"
      - "ai-assurance and eval when AI is involved"
    red_zone_triggers:
      - "production-data-access"
      - "production-telemetry-containing-customer-data"
      - "incident-containment"
      - "charge"
      - "refund"
      - "void"
      - "financial-reconciliation"
      - "payment-provider-configuration"
      - "customer-communication"
  - name: "valdris-feature-delivery"
    description: "Deliver a feature through Valdris as small verified vertical slices. Select as the delivery primary when the user clearly asks to build or implement new behavior, an integration, product change, API, UI, data flow, game, mobile app, or full-stack application. Establish and bind workload classification, then resolve the Layer 0 foundation gate before implementation. Add architecture, security, platform, and GenAI skills only as supporting risk lanes."
    path: "skills/valdris-feature-delivery/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "feature"
      - "integration"
      - "full-stack"
    triggers:
      - "build"
      - "add"
      - "implement"
      - "feature"
      - "integration"
    required_gates:
      - "goal"
      - "classification"
      - "foundation"
      - "code-intelligence"
      - "production"
      - "proof"
    conditional_gates: []
    red_zone_triggers:
      - "production-deploy"
      - "customer-data"
      - "billing"
  - name: "valdris-architecture-refactor"
    description: "Design architecture changes and refactors with code-intelligence, dependency, blast-radius, migration, and proof discipline. Select as the primary when redesign, module boundaries, migration, large refactoring, system design, or technical-debt reduction is the requested outcome. Require bound workload classification and a resolved Layer 0 foundation gate before implementation; use as a supporting lane for features only when architecture is consequential."
    path: "skills/valdris-architecture-refactor/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "architecture"
      - "refactor"
      - "migration"
      - "technical-debt"
    triggers:
      - "architecture"
      - "redesign"
      - "refactor"
      - "migrate"
      - "module boundaries"
    required_gates:
      - "classification"
      - "foundation"
      - "code-intelligence"
      - "production"
      - "proof"
    conditional_gates: []
    red_zone_triggers:
      - "breaking-contract"
      - "production-migration"
  - name: "valdris-security-audit"
    description: "Audit and remediate security, privacy, identity, tenant, secret, supply-chain, and agent-tool boundaries under Valdris. Select as the primary only when the requested outcome is a security, privacy, auth, RLS, tenant-isolation, vulnerability, compliance, secret, prompt-injection, or permission review/remediation. For a generic end-to-end audit use valdris-intake-route; for product delivery with security impact use this as a supporting lane."
    path: "skills/valdris-security-audit/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "security"
      - "privacy"
      - "auth"
      - "permissions"
      - "compliance"
    triggers:
      - "security"
      - "vulnerability"
      - "auth"
      - "RLS"
      - "tenant"
      - "secret"
      - "prompt injection"
    required_gates:
      - "classification"
      - "foundation"
      - "code-intelligence"
      - "production"
      - "proof"
    conditional_gates:
      - "ai-assurance and eval when AI is involved"
    red_zone_triggers:
      - "iam"
      - "rls"
      - "credential-rotation"
      - "destructive-security-test"
      - "customer-data"
  - name: "valdris-platform-release"
    description: "Plan and prove cloud, deployment, CI/CD, observability, scaling, incident, and recovery work. Select as the primary when the requested outcome is to change infrastructure, hosting, provider configuration, deployment, TestFlight/App Store delivery, reliability, SLOs, rollback, backup, failover, incident response, or capacity. This skill owns the release operation; valdris-proof-handoff owns the final readiness decision."
    path: "skills/valdris-platform-release/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "cloud"
      - "deployment"
      - "release"
      - "reliability"
      - "incident"
    triggers:
      - "deploy"
      - "cloud"
      - "CI"
      - "rollback"
      - "backup"
      - "failover"
      - "SLO"
      - "incident"
    required_gates:
      - "classification"
      - "foundation"
      - "code-intelligence"
      - "production"
      - "proof"
    conditional_gates:
      - "smoke for deployed, provider-integration, platform-native, or runtime behavior"
      - "domain pack for platform-native distribution or specialized runtime"
    red_zone_triggers:
      - "production-deploy"
      - "testflight-upload"
      - "app-store-promotion"
      - "dns"
      - "traffic"
      - "secrets"
      - "cloud-resource"
      - "failover"
      - "chaos"
      - "charge"
      - "refund"
      - "void"
      - "financial-reconciliation"
      - "payment-provider-configuration"
      - "customer-communication"
  - name: "valdris-genai-assurance"
    description: "Apply production assurance to AI, agent, RAG, model, prompt, tool, memory, and multimodal changes. Select as the primary when the requested outcome is AI assurance, evaluation, safety, model/prompt/provider behavior, RAG quality, or agent/tool governance. Use as a supporting lane when a feature or platform change merely includes AI; do not replace the main delivery skill for an otherwise product-focused build."
    path: "skills/valdris-genai-assurance/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "ai-product"
      - "agent"
      - "rag"
      - "model"
      - "prompt"
      - "eval"
    triggers:
      - "AI"
      - "LLM"
      - "agent"
      - "RAG"
      - "model"
      - "prompt"
      - "embedding"
      - "eval"
    required_gates:
      - "classification"
      - "foundation"
      - "code-intelligence"
      - "ai-assurance"
      - "eval"
      - "trajectory"
      - "production"
      - "proof"
    conditional_gates:
      - "RAG, tool, and memory controls only when each feature is active"
      - "model-judge calibration only when an evaluator is a model"
      - "typed runtime driver, tool calls, memory heads, economics, and MCP/A2A transcripts when those capabilities are active"
      - "youth-safety domain pack for child or teen audiences"
    red_zone_triggers:
      - "consequential-tool"
      - "model-provider-change"
      - "sensitive-ai-data"
      - "production-agent-promotion"
  - name: "valdris-proof-handoff"
    description: "Validate a Valdris run packet and produce the final readiness decision and handoff. Select as the primary for verify-before-merge, release-readiness review, issue closure, final proof, or handoff after delivery work is complete. Validate bound workload classification and Layer 0 foundation proof whenever the route requires them; this skill decides whether evidence supports done and does not perform delivery work."
    path: "skills/valdris-proof-handoff/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "review"
      - "finish"
      - "handoff"
      - "release-readiness"
    triggers:
      - "done"
      - "verify"
      - "review"
      - "handoff"
      - "release ready"
      - "close issue"
    required_gates:
      - "goal"
      - "context"
      - "skill-registry"
      - "provenance"
      - "neutrality"
      - "privacy"
      - "schema-compat"
      - "run-packet"
      - "review"
      - "proof"
    conditional_gates:
      - "classification when required by the route"
      - "code-intelligence for every non-docs route"
      - "foundation when required by workload classification or route"
      - "production for production impact"
      - "ai-assurance and eval for AI impact"
      - "trajectory for multi-checkpoint or agentic execution"
      - "smoke for deployed, provider-integration, platform-native, or runtime claims"
      - "authoritative-assurance for semantic or authoritative claims"
      - "requirements, runtime driver, dependency provenance, economics, interop, and trace-v2 operating contracts when applicable"
      - "commissioned domain packs"
      - "rca for bug, regression, incident, or self-heal routes"
      - "restricted-residue for clean-room convergence or migration when an external restricted-values manifest is commissioned"
    red_zone_triggers:
      - "approval-override"
      - "accept-residual-risk"
lifecycle_selection:
  max_primary: 1
  ambiguity_fallback: "valdris-route-goal"
  policy: "Lifecycle skills select which Valdris control-plane system owns the requested operation. They do not replace the eight work-type skills. Select exactly one lifecycle skill, execute its declared flow in order, and hand off only after its completion criteria are evidenced."
  deterministic_sequence: true
  tie_break_order:
    - "explicit lifecycle skill invocation"
    - "requested Valdris system or owned artifact"
    - "furthest downstream requested outcome"
    - "route and goal control when lifecycle intent remains ambiguous"
lifecycle_skills:
  - sequence: 1
    name: "valdris-commission"
    system: "commissioning"
    description: "Commission or refresh Valdris for a target repository from discovery through a committed, portable project pack. Select only when the requested outcome is harness installation, project-adapter creation, front-door setup, or commissioned-pack repair; do not select for ordinary product delivery inside an already commissioned repository."
    path: "skills/valdris-commission/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "commission a repository"
      - "refresh a commissioned project pack"
      - "install Valdris front doors"
    triggers:
      - "commission Valdris"
      - "set up the harness"
      - "install the harness"
      - "generate project adapter"
      - "refresh commissioned pack"
    required_inputs:
      - "target repository"
      - "commissioning answers or approved conservative defaults"
    required_outputs:
      - ".valdris-harness/project-adapter.json"
      - ".valdris-harness/commissioning-review.md"
      - "bounded target-root AGENTS.md and CLAUDE.md loaders"
      - "generated Codex and Claude skill mirrors"
    required_gates:
      - "skill-registry"
      - "provenance"
      - "neutrality"
      - "privacy"
    conditional_gates:
      - "commissioned-portability before a generated pack is handed off"
    next: "valdris-route-goal"
  - sequence: 2
    name: "valdris-route-goal"
    system: "routing-and-goal-control"
    description: "Turn an authorized request into deterministic intake, workload classification, an immutable Valdris route, and a durable budget-controlled goal. Select for starting or inspecting a Valdris run or resolving lifecycle ambiguity; ordinary feature, bug, audit, or release execution still uses the delivery primary recorded by this stage."
    path: "skills/valdris-route-goal/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "create deterministic intake and route"
      - "create or inspect a durable goal"
      - "resolve lifecycle ambiguity"
    triggers:
      - "route this through Valdris"
      - "create the durable goal"
      - "classify this request"
      - "which Valdris system"
      - "start a Valdris run"
    required_inputs:
      - "committed commissioned pack"
      - "authorized natural-language request"
      - "operator, profile, environment, and authority boundary"
    required_outputs:
      - "run/intake.json"
      - "run/workload-classification.json"
      - "run/route.json"
      - "goal/goal.json"
    required_gates:
      - "intake"
      - "classification"
      - "route"
      - "goal"
      - "skill-registry"
    conditional_gates: []
    next: "valdris-assure"
  - sequence: 3
    name: "valdris-assure"
    system: "assurance"
    description: "Resolve the Valdris assurance plan before implementation by proving Layer 0, classifying all 13 production assurance domains, and activating applicable AI, async, and domain controls. Select for whole-run assurance state, tier, or coverage; use narrower security or GenAI work skills when that engineering outcome itself is the task."
    path: "skills/valdris-assure/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "resolve Layer 0"
      - "classify the 13 production assurance domains"
      - "activate cross-cutting and domain assurance"
    triggers:
      - "assure this run"
      - "resolve Layer 0"
      - "check all 13 domains"
      - "set assurance tier"
      - "activate AI or async assurance"
    required_inputs:
      - "bound intake, workload classification, route, and goal"
      - "commissioned catalogs and project adapter"
    required_outputs:
      - "foundation/assessment.json when applicable"
      - "production/layer-assessment.json when applicable"
      - "AI and domain assurance artifacts or route-bound non-applicability"
    required_gates:
      - "intake"
      - "classification"
      - "route"
      - "goal"
      - "skill-registry"
    conditional_gates:
      - "foundation for every route whose foundation assessment is applicable"
      - "production for every production-impacting route"
      - "ai-assurance and eval when the classification contains AI behavior"
      - "domain-packs when workload signals activate a commissioned pack"
      - "schema-compat and authoritative-assurance when stronger controls are added"
    next: "valdris-connect-runtime"
  - sequence: 4
    name: "valdris-connect-runtime"
    system: "runtime-connectivity"
    description: "Connect Codex, Claude, Hermes, or a custom agent to a commissioned Valdris run and establish truthful local, Live Run, or replay state. Select for runtime adapters, bridge sessions, event streaming, leases, or replay; do not select merely because an ordinary coding task happens to be performed by an agent."
    path: "skills/valdris-connect-runtime/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "connect an external coding runtime"
      - "establish Live Run telemetry"
      - "inspect or replay runtime events"
    triggers:
      - "connect Codex"
      - "connect Claude"
      - "connect Hermes"
      - "start Live Run"
      - "stream events"
      - "replay the run"
    required_inputs:
      - "bound route and goal"
      - "commissioned runtime adapter"
      - "operator-supplied runtime credentials for Live Run"
    required_outputs:
      - "run/mode.json"
      - "runtime/driver-state.json when required"
      - "real session events and artifacts for Live Run or an explicit local-mode decision"
    required_gates:
      - "context"
    conditional_gates:
      - "authoritative-assurance runtime identity when semantic or authoritative AI claims are made"
      - "Live Run bridge lease and credential-boundary verification"
    next: "valdris-execute-workflow"
  - sequence: 5
    name: "valdris-execute-workflow"
    system: "workflow-execution"
    description: "Execute the work skill selected by a bound Valdris route through small evidence-bearing slices and revision-safe goal checkpoints. Select when the requested outcome is to run, continue, or resume the governed delivery loop; let the route's eight-skill catalog decide whether the actual engineering work is a feature, bug, architecture, security, platform, GenAI, intake, or proof task."
    path: "skills/valdris-execute-workflow/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "execute the routed engineering workflow"
      - "run the durable checkpoint loop"
      - "coordinate the selected work-type skill"
    triggers:
      - "execute the Valdris workflow"
      - "continue the goal loop"
      - "implement the routed work"
      - "run the next bounded slice"
      - "resume the run"
    required_inputs:
      - "passed route and goal gates"
      - "resolved pre-implementation assurance"
      - "delivery primary selected in run/route.json"
    required_outputs:
      - "implementation and test evidence for the bounded slice"
      - "fresh code-intelligence and trajectory artifacts when applicable"
      - "revision-safe goal checkpoint transitions"
    required_gates:
      - "goal"
    conditional_gates:
      - "code-intelligence for code, architecture, debugging, refactor, or cross-file claims"
      - "trajectory for multi-checkpoint or agentic work"
      - "delivery-primary validation selected by the immutable route"
      - "Red Zone approval before consequential actions"
    next: "valdris-prove-govern"
  - sequence: 6
    name: "valdris-prove-govern"
    system: "proof-and-governance"
    description: "Turn completed Valdris execution into typed evidence, applicable gate results, scoped approvals, independent review, and a frozen run packet. Select for the proof-and-governance system or finish-line assembly; use valdris-proof-handoff as the work-phase primary when the route itself is at final review."
    path: "skills/valdris-prove-govern/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "assemble typed proof"
      - "run finish-line gates"
      - "obtain independent review and scoped approvals"
    triggers:
      - "prove this run"
      - "run the finish line"
      - "govern this completion"
      - "assemble the run packet"
      - "request independent review"
    required_inputs:
      - "completed bounded implementation"
      - "current route, goal, catalogs, evidence, and gate artifacts"
    required_outputs:
      - "proof/proof.json"
      - "review/review.json"
      - "run/packet.json"
      - "applicable approval and smoke artifacts"
    required_gates:
      - "proof"
      - "review"
      - "run-packet"
    conditional_gates:
      - "smoke for deployed, provider, platform-native, or runtime behavior"
      - "rca for bug, regression, incident, or self-heal routes"
      - "Red Zone and route approval for actions that require authority"
    next: "valdris-trust-improve"
  - sequence: 7
    name: "valdris-trust-improve"
    system: "trust-and-improvement"
    description: "Decide the strongest supportable Valdris trust level, perform an authorized promotion or handoff, and close verified failures into governed learning. Select for final trust, semantic or authoritative release eligibility, promotion, self-healing, or lessons learned after a run packet already exists."
    path: "skills/valdris-trust-improve/SKILL.md"
    implicit_invocation: true
    primary_for:
      - "decide structural, semantic, or authoritative trust"
      - "promote or hand off a proved run"
      - "capture self-healing and lessons learned"
    triggers:
      - "make the final trust decision"
      - "promote this run"
      - "release and learn"
      - "self-heal the harness"
      - "capture lessons learned"
    required_inputs:
      - "validated final run packet"
      - "commissioned acceptance and authority policies"
      - "provider-backed receipts when stronger trust is claimed"
    required_outputs:
      - "handoff/final.md"
      - "release/promotion.json when promotion occurs"
      - "learning/feedback-loop.json or self_heal/self_heal_report.md when learning is required"
    required_gates:
      - "run-packet"
      - "proof"
      - "review"
      - "privacy"
    conditional_gates:
      - "authoritative-assurance before an authoritative claim"
      - "promotion receipt validation when promotion occurs"
      - "learning receipt validation when self-healing or lessons are recorded"
    next: null
