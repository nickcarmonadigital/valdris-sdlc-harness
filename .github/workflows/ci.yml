name: Harness CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trust-boundary-hardening:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Knowledge vault gate
        run: npm run knowledge:gate

      - name: Skill registry gate
        run: npm run skills:gate

      - name: Enterprise and AI adversarial verifier
        run: npm run verify:enterprise-ai

      - name: Code intelligence local scan
        run: node scripts/code-intelligence-scan.mjs --repo . --provider local

      - name: Code intelligence / anchor gates
        run: npm run code-intelligence:gate

      - name: Harness adversarial verifier
        run: npm run verify:harness

      - name: Commissioning smoke
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/valdris-commissioned"
          npm run commission -- --repo . --project-name "Valdris SDLC Harness" --out "$OUT" --yes
          node -e "const fs=require('fs'); const path=require('path'); const root=path.join(process.env.RUNNER_TEMP,'valdris-commissioned'); const a=JSON.parse(fs.readFileSync(path.join(root,'project-adapter.json'),'utf8')); const required=['knowledge/index.md','controls/domain-packs/mobile-ios.v1.json','skills/registry.json','.agents/skills/registry.json','.claude/skills/registry.json','scripts/enterprise-ai-gate-all.mjs','.github/workflows/valdris-assurance.yml','package.json']; if(a.proofSchema?.schema!=='uash.proof.v1'||!a.runtime?.adapterAwareBridge||!a.humanApproval?.tokenRequiredForGrant||a.productionReadiness?.schema!=='uash.production-readiness.v2'||a.generativeAiAssurance?.schema!=='uash.ai-assurance.v1'||a.goalLoop?.schema!=='uash.goal.v1'||a.skillRouter?.catalogSize!==8||a.finishLineAssurance?.required!==true||a.knowledgeVault?.root!=='knowledge/'||required.some(f=>!fs.existsSync(path.join(root,f)))) process.exit(1);"
