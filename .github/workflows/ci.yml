name: Harness CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Reject high-severity dependency advisories
        run: npm run dependency:audit

  trust-boundary-hardening:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Runtime-driver local identity preflight
        run: npm run verify:runtime-driver-identity
        timeout-minutes: 2

      - name: Attested executor path and identity preflight
        run: npm run verify:attested-executor
        timeout-minutes: 5

      - name: Formatting and whitespace gate
        run: npm run format:check
        env:
          VALDRIS_FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Build
        run: npm run build

      - name: Release artifact privacy behavior verifier
        run: npm run verify:release-privacy

      - name: Next release artifact privacy gate
        run: npm run privacy:release

      - name: Browser bridge proxy boundary verifier
        run: npm run verify:bridge-proxy

      - name: Bridge credential boundary verifier
        run: npm run verify:bridge-security

      - name: Knowledge vault gate
        run: npm run knowledge:gate

      - name: Skill registry gate
        run: npm run skills:gate

      - name: Canonical catalog integrity gate
        run: npm run catalog:gate

      - name: Clean-room provenance gate
        run: npm run provenance:gate

      - name: Project-neutrality gate
        run: npm run neutrality:gate

      - name: Privacy boundary gate
        run: npm run privacy:gate

      - name: Assurance schema compatibility gate
        run: npm run schema:compat:gate

      - name: Clean-room work-harness import verifier
        run: npm run verify:work-harness-import

      - name: Clean-room convergence adversarial verifier
        run: npm run verify:clean-room-convergence

      - name: Portable proof security verifier
        run: npm run verify:proof-security

      - name: Portable execution adversarial verifier
        run: npm run verify:portable-execution

      - name: Run-packet trust verifier
        run: npm run verify:run-packet-trust

      - name: Semantic and authoritative assurance verifier
        run: npm run verify:v09-assurance

      - name: Authoritative release/tag gate verifier
        run: npm run verify:authoritative-release

      - name: Protected pre-tag release workflow verifier
        run: npm run verify:authoritative-release-workflow

      - name: Current release eligibility gate
        run: npm run release:gate:authoritative

      - name: Commissioned nested-pack portability verifier
        run: npm run verify:commissioned-portability

      - name: Enterprise and AI adversarial verifier
        run: npm run verify:enterprise-ai

      - name: Code intelligence local scan
        run: node scripts/code-intelligence-scan.mjs --repo . --provider local

      - name: Post-scan privacy boundary gate
        run: npm run privacy:gate

      - name: Code intelligence / anchor gates
        run: npm run code-intelligence:gate

      - name: Harness adversarial verifier
        run: npm run verify:harness

      - name: Runtime closure meta-gate
        run: npm run verify:runtime-closure

      - name: Install generated Codex skills
        run: npm run skills:install:codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home

      - name: Verify generated Codex skills
        run: npm run skills:check:codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home

      - name: Clean worktree gate
        run: npm run worktree:check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  portability-macos:
    runs-on: macos-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Runtime-driver local identity preflight
        run: npm run verify:runtime-driver-identity
        timeout-minutes: 2

      - name: Attested executor path and identity preflight
        run: npm run verify:attested-executor
        timeout-minutes: 5

      - name: Clean-room convergence and generated-pack verifier
        run: npm run verify:clean-room-convergence

      - name: Commissioned nested-pack portability verifier
        run: npm run verify:commissioned-portability

      - name: Semantic and authoritative assurance verifier
        run: npm run verify:v09-assurance

      - name: Authoritative release/tag gate verifier
        run: npm run verify:authoritative-release

      - name: Protected pre-tag release workflow verifier
        run: npm run verify:authoritative-release-workflow

      - name: Full harness and generated skill-pack verifier
        run: npm run verify:harness

      - name: Install and verify generated Codex skills
        run: npm run skills:install:codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home

      - name: Check installed Codex skills
        run: npm run skills:check:codex
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home

      - name: Clean worktree gate
        run: npm run worktree:check
