      <stop offset="45%" stop-color="#0b1220" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554" stop-opacity="0.92"/>
