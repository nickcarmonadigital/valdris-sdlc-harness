<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Valdris Trust Model">
<defs>
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="80%">
