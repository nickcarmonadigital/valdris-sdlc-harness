  <text x="66" y="98" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="16" font-weight="500">Assurance strength increases from valid structure, to behavioral proof, to independently attested execution and state.</text>
<rect x="50" y="142" width="480" height="364" rx="26" fill="#020617" opacity="0.48" stroke="#2dd4bf" stroke-width="1.6"/><text x="76" y="188" text-anchor="start" fill="#2dd4bf" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="23" font-weight="900">1. Structural assurance</text><g>
