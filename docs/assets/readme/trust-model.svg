  </g><text x="800" y="806" text-anchor="middle" fill="#e5e7eb" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="17" font-weight="850">Authoritative production claims require the commissioned executor and rollback-resistant provider state together.</text><text x="800" y="850" text-anchor="middle" fill="#f59e0b" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="16" font-weight="850">Human approval can authorize a decision. It cannot turn missing or failing technical proof into a pass.</text></svg>
